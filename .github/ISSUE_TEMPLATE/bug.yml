name: Bug
description: 실제 세션에서 스킬이 잘못된 일을 했습니다.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        `skills/misc/`의 버그는 수정되지 않습니다 (`.out-of-scope/frozen-misc-skills.md` 참고). `npx skills`의 설치 프로그램 문제는 skills.sh에 올려 주세요.
  - type: input
    id: skill
    attributes:
      label: 스킬
      description: 어떤 스킬인가요? 예: `to-tickets`, `grilling`.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: 하니스와 버전
      description: 예: Claude Code 2.3.1, Codex CLI 0.40, Cursor. 어떻게 설치했는지(플러그인 또는 skills.sh)와 스킬 버전도 적어 주세요.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 모델과 노력 수준
      description: 예: Opus, high effort. 문제가 발생했을 때 컨텍스트가 대략 얼마나 찼었나요?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 실행했고 스킬이 무엇을 했나요? 세션의 관련 부분을 붙여 넣어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 것
      description: 스킬이 대신 무엇을 해야 했고, SKILL.md의 어느 줄(있다면)이 그렇게 말하나요?
    validations:
      required: true
